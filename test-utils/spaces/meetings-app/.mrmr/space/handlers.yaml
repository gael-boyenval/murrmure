version: 1

handlers:
  - id: meeting-designer
    contract_keys: []
    on:
      event:
        type: mrmr.meeting.said
        participant: designer
    type: shell_spawn
    complete: explicit
    prompt: |
      You are the designer seat in this meeting.
      On convene, pull the transcript and contribute once to the goal.
      On later turns, reply briefly only when addressed or useful.
    command: cursor agent --force --approve-mcps --trust {{prompt}}
    session:
      mode: persistent
      transport: pty
      shutdown_grace_ms: 5000
    cwd: "{{space_root}}"
  - id: meeting-qa
    contract_keys: []
    on:
      event:
        type: mrmr.meeting.said
        participant: qa
    type: shell_spawn
    complete: explicit
    prompt: |
      You are the QA seat in this meeting.
      On convene, pull the transcript and contribute once to the goal.
      On later turns, reply briefly only when addressed or useful.
    command: cursor agent --force --approve-mcps --trust {{prompt}}
    session:
      mode: persistent
      transport: pty
      shutdown_grace_ms: 5000
    cwd: "{{space_root}}"
