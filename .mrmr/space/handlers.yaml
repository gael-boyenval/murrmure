version: 1

x-feedback-prompt: &feedback_prompt |
  You are the Murrmure feedback receiver agent for spc_murrmure.

  ## Task
  {{instruction}}

  ## Source
  - Kind: {{kind}}
  - Repo: {{repo}}
  - Reported at: {{reported_at}}
  - Run: {{run_id}}
  - Session: {{session_id}}

  ## Payload
  Summary: {{summary}}
  Topic: {{topic}}
  Failure type: {{failure_type}}
  Suggestion: {{suggestion}}
  Logs: {{logs}}
  Docs: {{docs}}

  ## Context
  {{context}}

  ## Rules
  - Write one Markdown file under `feedbacks/` following `feedbacks/README.md`.
  - Use the naming pattern from the task above (failure vs improvement slug).
  - You write the file; confirm the path when done.
  - Workspace root: {{space_root}}

x-meeting-session: &meeting_session
  mode: persistent
  transport: pty
  shutdown_grace_ms: 5000

handlers:
  - id: on-dev-failure
    description: Write a failure feedback report when spc_my_space reports a Murrmure failure
    contract_keys: []
    on:
      event:
        type: murrmure.feedback.failure
        source:
          - "/spaces/spc_my_space"
          - "/spaces/spc_murrmure"
    type: shell_spawn
    complete: auto
    params:
      kind: failure
      instruction: >-
        Write a failure report as Markdown under feedbacks/ named
        YYYY-MM-DD-failure-<slug>.md. Use sections from feedbacks/README.md:
        Summary, Context, Evidence, Murrmure improvement, Source.
      repo: "{{event.source}}"
      failure_type: "{{event.data.failure_type}}"
      summary: "{{event.data.summary}}"
      logs: "{{event.data.logs}}"
      docs: "{{event.data.docs}}"
      context: "{{event.data.context}}"
      reported_at: "{{event.data.reported_at}}"
    prompt: *feedback_prompt
    command: cursor agent -p --force {{prompt}}
    cwd: "{{space_root}}"
    delivery: fail_fast
    timeout_ms: 600000

  - id: on-dev-improvement
    description: Write an improvement request when spc_my_space asks for a Murrmure DX change
    contract_keys: []
    on:
      event:
        type: murrmure.feedback.requestImprovement
        source:
          - "/spaces/spc_my_space"
          - "/spaces/spc_murrmure"
    type: shell_spawn
    complete: auto
    params:
      kind: improvement
      instruction: >-
        Write an improvement request as Markdown under feedbacks/ named
        YYYY-MM-DD-improvement-<slug>.md. Use sections from feedbacks/README.md:
        Topic, Summary, Suggestion, Context, Source.
      repo: "{{event.source}}"
      topic: "{{event.data.topic}}"
      summary: "{{event.data.summary}}"
      suggestion: "{{event.data.suggestion}}"
      docs: "{{event.data.docs}}"
      context: "{{event.data.context}}"
      reported_at: "{{event.data.reported_at}}"
    prompt: *feedback_prompt
    command: cursor agent -p --force {{prompt}}
    cwd: "{{space_root}}"
    delivery: fail_fast
    timeout_ms: 600000

  - id: meeting-murrmure-architect
    description: Architect seat in a Murrmure meeting
    contract_keys: []
    on:
      event:
        type: mrmr.meeting.said
        participant: murrmure-architect
    type: shell_spawn
    complete: explicit
    prompt: |
      You are the architect seat for the Murrmure platform monorepo in this meeting.
      Focus on protocol boundaries, ADRs, federation, and cross-package design — not line-level implementation unless asked.

      Pull the transcript with your participant_id. Read `you` and addressed_to_you.
      Convene: one short contribution to the goal if another seat exists. Do not start work or attach files unless the goal names this seat to do that.
      Later: speak or edit only if the chair or the goal asked this seat. Another seat's intro is not a ticket. No artifacts unless asked.
      Careful: any change on this repo while the server is up will break active sessions. Inform other seats when asked to do work.
    command: cursor agent --model claude-opus-5-high --force --approve-mcps --trust {{prompt}}
    continuation:
      command: cursor agent --resume {{continuation_token}} --model claude-opus-5-high --force --approve-mcps --trust {{prompt}}
      token_field: session_id
      mint_command: cursor agent create-chat
    session: *meeting_session
    cwd: "{{space_root}}"

